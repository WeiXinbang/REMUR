[package]
name = "remur"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[features]
default = ["cached-decode", "software-tlb"]
cached-decode = []
software-tlb = []
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
goblin = "0.9"
flate2 = "1.1"
serde_json = "1.0"
tar = "0.4"
ureq = { version = "2.10", features = ["json"] }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[dev-dependencies]
criterion = "0.7"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[[bench]]
name = "isa_benchmark"
harness = false
